# nginx site for HRMS when the server's nginx already owns ports 80/443 (other sites share this VPS).
# Install:  cp deploy/nginx-worksync-hrms.conf /etc/nginx/sites-available/worksync-hrms
#           ln -s /etc/nginx/sites-available/worksync-hrms /etc/nginx/sites-enabled/worksync-hrms
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d worksync-hrms.cloudandecho.tech     # adds HTTPS and the redirect
# The app listens on 127.0.0.1:3300 (APP_PORT in .env.production changes it; keep this file in step).
server {
    listen 80;
    listen [::]:80;
    server_name worksync-hrms.cloudandecho.tech;

    # Document uploads go through server actions (limit is DOCUMENT_MAX_MB, 5 by default); nginx's own default is only 1m.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the app trusts the first address as the client (rate limits, device records),
        # so a visitor must not be able to supply it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
